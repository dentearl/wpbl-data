name: Update WPBL Schedule Data

on:
  schedule:
    # 04:30 UTC daily = 23:30 CDT (nightly after games finish in Springfield, IL)
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-wpbl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run WPBL Scraper
        run: node scripts/scrapeWPBL.js --season 2026

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/; then
            git add data/
            git commit -m "Update WPBL 2026 regular season data [skip ci]"
            git push
            echo "Successfully committed and pushed updated WPBL data."
          else
            echo "No data changes detected. Everything is up to date."
          fi
